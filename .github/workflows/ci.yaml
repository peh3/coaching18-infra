      # 3. Infrastructure as Code (IaC) Scan on Terraform
      - name: Run Snyk IaC Test
        run: snyk iac test --severity-threshold=low

      # 2. Monitor: Record baseline inventory to app.snyk.io
      - name: Snyk Monitor (Open Source)
        run: snyk monitor

      - name: Snyk Monitor (IaC)
